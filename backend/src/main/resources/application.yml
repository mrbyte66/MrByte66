server:
  port: 8080

spring:
  application:
    name: mrbyte66-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mrbyte66}
    username: ${SPRING_DATASOURCE_USERNAME:mrbyte66}
    password: ${SPRING_DATASOURCE_PASSWORD:mrbyte66-dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.sql
    enabled: true

app:
  auth:
    jwt-secret: ${APP_JWT_SECRET:mrbyte66-local-dev-secret-change-in-prod-000}
    jwt-expiry-minutes: ${APP_JWT_EXPIRY_MINUTES:720}
    admin-username: ${APP_ADMIN_USERNAME:admin}
    # Local development only. Production must override via environment.
    admin-password: ${APP_ADMIN_PASSWORD:admin-dev}
