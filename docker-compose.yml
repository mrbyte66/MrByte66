name: mrbyte66

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mrbyte66
      POSTGRES_USER: mrbyte66
      # Local development only. Do not use in production.
      POSTGRES_PASSWORD: mrbyte66-dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrbyte66 -d mrbyte66"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mrbyte66
      SPRING_DATASOURCE_USERNAME: mrbyte66
      SPRING_DATASOURCE_PASSWORD: mrbyte66-dev
      # Local development only. Do not use in production.
      APP_JWT_SECRET: mrbyte66-local-dev-secret-change-in-prod-000
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_PASSWORD: admin-dev
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
